; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini_pro

[common]
framework = arduino
monitor_speed = 115200
monitor_eol = LF
extra_scripts =
	pre:scripts/patch_h4.py
	pre:scripts/project_defines.py
	pre:scripts/build_web.py
; The H4 stack moves as a set: these seven versions are tested together, so bump
; them together. scripts/patches/*.patch are derived against exactly these
; revisions -- see scripts/patches/README.md before changing any of them.
;
; This is the combination h4plugins 3.5.8 pins in its own platformio.ini, which
; is the set upstream CI builds every example against, ESP8266 included. Only the
; versions were taken from that file; none of its build settings apply here.
;
; ArmadilloHTTP is the one deviation: 0.2.0 rather than the 0.1.9 upstream tests.
; That release is the MIT relicence plus a single added method, and this build
; sets USE_HTTPREQ 0, so the library is compiled but never exercised.
lib_deps =
	https://github.com/HamzaHajeir/H4#4.0.10
	https://github.com/HamzaHajeir/H4Tools#0.0.16
	https://github.com/HamzaHajeir/H4AsyncTCP#0.0.25
	https://github.com/HamzaHajeir/H4AsyncMQTT#1.0.0-rc12
	https://github.com/HamzaHajeir/ArmadilloHTTP#0.2.0
	https://github.com/HamzaHajeir/H4AsyncWebServer#0.0.13
	; Never pin 3.5.6: its H4P_Timekeeper.cpp calls LOCK_TCPIP_CORE()
	; unconditionally, which does not exist on the ESP8266, so it does not build
	; for this board at all. 3.5.7 added the missing no-op fallback.
	https://github.com/HamzaHajeir/h4plugins#3.5.8
	envirodiy/SDI-12@^2.2.0
	;adafruit/Adafruit BME280 Library@^2.2.4
	finitespace/BME280@^3.0.0
	adafruit/Adafruit MLX90614 Library@^2.1.5
	sparkfun/SparkFun SCD30 Arduino Library@^1.0.20
	sparkfun/SparkFun I2C GPS Reading and Control@^1.0.6
	mikalhart/TinyGPSPlus
	robtillaart/ADS1X15@^0.5.0
	greiman/SdFat@^2.0.0
	robtillaart/TCA9548
	phzi/DFRobot_MultiGasSensor
upload_speed = 921600
build_src_flags = ;-DPROJ_BAUD_RATE=${common.monitor_speed}
build_flags = -DPROJ_BAUD_RATE=${common.monitor_speed}

board_build.filesystem = littlefs

[esp32]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.08.10/platform-espressif32.zip
platform_packages =
    ; platformio/framework-arduinoespressif32 @ https://github.com/HamzaHajeir/arduino-esp32#lwip-tls-2.0.11
    platformio/framework-arduinoespressif32 @ https://github.com/HamzaHajeir/esp32-arduino-lib-builder/releases/download/31/framework-arduinoespressif32-all-release_v5.1-6dff5b8.zip
    platformio/framework-arduinoespressif32-libs @ https://github.com/HamzaHajeir/esp32-arduino-lib-builder/releases/download/31/framework-arduinoespressif32-libs-all-release_v5.1-6dff5b8.zip

lib_deps = 
	${common.lib_deps}
	AsyncUDP
	LittleFS
lib_ldf_mode = chain

build_flags = 
	${common.build_flags}
	-DLWIP_ALTCP=1
	-DLWIP_ALTCP_TLS=1
	-DLWIP_ALTCP_TLS_MBEDTLS=1
	; -w
	-DCORE_DEBUG_LEVEL=0
	-DEMBEDDED_PLATFORM
	-I src


monitor_filters = esp32_exception_decoder
	time
	log2file

[env:esp32doit-devkit-v1]
extends = common, esp32
board = esp32doit-devkit-v1
board_build.partitions = no_ota.csv

[env:esp32s3-devkitc]
extends = common, esp32
board = esp32-s3-devkitc-1
build_flags = ${esp32.build_flags}
	; -DBOARD_HAS_PSRAM

board_build.flash_mode = qio
; board_build.arduino.memory_type = qio_qspi

[env:pico]
extends = common
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#196d31bbafaf60b84751b1a415d8dca2365debdf
platform_packages =
   framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#3.9.5
framework = arduino
board = rpipicow
board_build.core = earlephilhower
monitor_speed = 921600
lib_ldf_mode = deep+

build_flags = ${common.build_flags}
	-DEMBEDDED_PLATFORM
	'-DARDUINO_BOARD="RASPBERRY_PI_PICO_W"'
	; -DDEBUG_RP2040_PORT=Serial
	; -DLFS_YES_TRACE
	; -fstack-protector
	; -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	; -DPIO_FRAMEWORK_ARDUINO_NO_USB
    -I src

board_build.filesystem_size = 0.6m
upload_port = F:

[env:nodemcuv2]
extends = common
platform = espressif8266@4.2.0
board = nodemcuv2
build_flags = 
	${common.build_flags}
	-D BEARSSL_SSL_BASIC
	-DNDEBUG
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
    -w
	-DEMBEDDED_PLATFORM
	; -DLWIP_ALTCP=1
	; -DLWIP_ALTCP_TLS=1
	; -DLWIP_ALTCP_TLS_MBEDTLS=1
	-DPROJ_BAUD_RATE=${common.monitor_speed}
	-I src
build_src_flags = ;-DPROJ_BAUD_RATE=${common.monitor_speed}

board_build.flash_mode = dio

board_build.ldscript = eagle.flash.4m1m.ld
lib_deps = 
	${common.lib_deps}
	; https://github.com/HamzaHajeir/H4AsyncTCP#0.0.11
	ESPAsyncUDP

monitor_filters = esp8266_exception_decoder
	time
	log2file
lib_ldf_mode = deep+
; build_type = release

[env:d1_mini_pro]
extends = common
platform = espressif8266@4.2.0
board = d1_mini_pro
build_flags = 
	${common.build_flags}
	-D BEARSSL_SSL_BASIC
	-DNDEBUG
	; LOW_MEMORY (liblwip2-536.a), not HIGHER_BANDWIDTH (liblwip2-1460.a).
	; MSS drops from 1460 to 536, which shrinks the per-connection send buffer and
	; the pbuf pool - and per-connection memory is exactly what this board runs
	; out of. Measured with a phone joining: about 7.5 KB disappeared into
	; concurrent connections as Android fired its captive-portal probes alongside
	; the page load, leaving the page handler ~1.5 KB and a 760-byte largest
	; block, well under the 3000 H4AsyncTCP needs to accept anything further.
	; Throughput is irrelevant here - the UI is one 8.6 KB page, sent in paced
	; 512-byte chunks that fit inside a 536-byte MSS anyway.
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -w
	-DEMBEDDED_PLATFORM
	;-DLWIP_ALTCP=0
	;-DLWIP_ALTCP_TLS=0
	;-DLWIP_ALTCP_TLS_MBEDTLS=0
	; Diagnostics, OFF by default: measured at +3.3 KB of static RAM for the two
	; debug levels alone, which on this board came straight out of the heap and
	; took free heap with the AP up from 9064 down to 3224 - below H4AsyncTCP's
	; own accept threshold. In other words, leaving them on breaks the thing they
	; are meant to diagnose. Enable one at a time, briefly.
	;
	; H4AT_DEBUG=1 -> "LOW HEAP %u DISCARDING %p" when a connection is refused
	; H4T_DEBUG=1  -> "MBX FAIL STATUS: FH=.. MXBLK=.. ASKED:.." on a failed alloc
	; H4P_SYS_LEVEL=2 / H4P_LOG_MESSAGES=1 -> H4 service transitions
	;
	; The first two only work at all because h4tools.patch and h4asynctcp.patch
	; made those #defines #ifndef-guarded; upstream defines them unguarded, so the
	; header silently won and -w hid the redefinition warning.
	;-DH4AT_DEBUG=1
	;-DH4T_DEBUG=1
	;-DH4P_SYS_LEVEL=2
	;-DH4P_LOG_MESSAGES=1
	-DPROJ_BAUD_RATE=${common.monitor_speed}
	-I src
build_src_flags = ;-DPROJ_BAUD_RATE=${common.monitor_speed}

board_build.flash_mode = dio

board_build.ldscript = eagle.flash.4m1m.ld
lib_deps = 
	${common.lib_deps}
	; https://github.com/HamzaHajeir/H4AsyncTCP#0.0.23
	ESPAsyncUDP

monitor_filters = esp8266_exception_decoder
	time
	log2file
lib_ldf_mode = deep+
; build_type = release
